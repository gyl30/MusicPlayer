<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MusicPlayer · 交互原型</title><style>
:root{--paper:#f5f6f3;--ink:#24332f;--muted:#65746e;--accent:#176d58;--line:#dce3de;--selected:#e0eee6}*{box-sizing:border-box}body{margin:0;background:#e7eae6;color:var(--ink);font:14px/1.6 system-ui,"Noto Sans CJK SC",sans-serif}button,select,input{font:inherit;accent-color:var(--accent)}button,select{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:7px 12px;cursor:pointer}button:hover{background:var(--selected)}button:active{background:#c7ddd0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{color:#89958e;background:#edf0ec;cursor:default}.primary{background:var(--accent);color:white}.primary:hover{background:#125744}header,footer,.row{display:flex;align-items:center;gap:12px}header{padding:12px 16px}header strong{flex:1}main{display:flex;justify-content:center;align-items:flex-start;gap:24px;padding:32px;flex-wrap:wrap}.window{background:var(--paper);border:1px solid #becac1;border-radius:4px;overflow:hidden;width:360px}.song{padding:22px 18px 12px}.eyebrow{color:var(--muted);font-size:12px}.title{font-size:20px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:6px 0 14px}input[type=range]{width:100%;height:24px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.controls{justify-content:center;padding:10px}.controls button{padding:0;width:36px;height:36px;border:0;background:transparent}.controls .primary{width:48px;height:48px;background:var(--accent);color:white;border-radius:24px}svg{width:20px;height:20px;fill:currentColor;vertical-align:middle}.volume{padding:0 18px 12px}.volume input{width:90px}.lyric{text-align:center;padding:12px;color:var(--muted);border-top:1px solid var(--line)}.library{padding:12px 10px;background:transparent}.library>summary{padding:8px;font-weight:600}.track{display:flex;width:100%;text-align:left;gap:12px;border:0;border-radius:4px;padding:10px 8px;align-items:center}.track span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.track small{color:var(--muted)}.playing{color:var(--accent);font-weight:650}.track[aria-selected=true]{background:var(--selected)}footer{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}footer span{flex:1}.manager{width:760px}.columns{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;padding:20px}.pane{min-width:0}.pane select{width:100%;margin:8px 0 14px}.pane label{display:flex;align-items:center;gap:8px;background:white;padding:10px 6px}.actions{display:flex;flex-direction:column;gap:10px;justify-content:center}.danger{color:#a23931}.notice{padding:0 20px 20px;color:var(--muted);font-size:12px}.inspector{max-width:1120px;margin:24px auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 24px}.error{color:#a23931}#management[hidden]{display:none}@media(max-width:700px){main{padding:16px}.manager{width:100%}.columns{grid-template-columns:1fr}.actions{flex-direction:row;flex-wrap:wrap}}
header button{border-color:transparent}.track{background:transparent}.title{font-size:18px}.song{padding-top:14px}.pane label{background:transparent}
</style></head><body>
<!-- 依据：Qt Widgets 当前代码。单一浅色方向，主界面紧凑，管理页展开；纯本地样例，不调用音频或数据库。 -->
<svg style="display:none"><symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></symbol><symbol id="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"></path></symbol><symbol id="next" viewBox="0 0 24 24"><path d="M5 5v14l10-7zm11 0h3v14h-3z"></path></symbol></svg>
<div class="inspector"><strong>MusicPlayer · 原型</strong><label>状态 <select id="scenario"><option>播放中</option><option>暂停</option><option>空歌单</option><option>长文件名</option><option>播放错误</option></select></label><span class="eyebrow">单击选中 · 双击播放 · 可调整进度与音量</span></div>
<main><section class="window" data-screen-label="主播放界面"><header><strong>MusicPlayer</strong><button id="add">添加</button><button id="manage">管理</button></header><div class="song"><div class="eyebrow" id="status">正在播放</div><div class="title" id="title" title="陈绮贞 · 旅行的意义">陈绮贞 · 旅行的意义</div><input aria-label="播放进度" id="seek" type="range" max="245" value="83"><div class="times"><span id="time">01:23</span><span>04:05</span></div></div><div class="row controls"><button id="mode" title="切换播放模式">循环</button><button id="prev" aria-label="上一首"><svg style="transform:rotate(180deg)"><use href="#next"></use></svg></button><button id="toggle" class="primary" aria-label="暂停"><svg><use href="#pause"></use></svg></button><button id="nextTrack" aria-label="下一首"><svg><use href="#next"></use></svg></button><button id="stop" aria-label="停止"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"></path></svg></button></div><div class="row volume"><span class="eyebrow">音量</span><input aria-label="音量" type="range" value="65"><span class="eyebrow">65%</span></div><details class="library" open><summary>我的收藏 · 4 首</summary><div id="tracks"></div></details></section>
<section class="window manager" id="management" data-screen-label="音乐管理" hidden><header><strong>管理歌单</strong><button id="cancel">取消</button></header><div class="columns"><div class="pane"><strong>源歌单</strong><select id="source"><option>我的收藏</option></select><div id="sourceSongs"></div></div><div class="actions"><button id="copy">复制 →</button><button id="move">移动 →</button><button id="remove" class="danger">从歌单移除</button></div><div class="pane"><strong>目标歌单</strong><select><option>午后散步</option></select><div id="destSongs"></div></div></div><div class="notice" id="notice">更改仅在应用后保存；移除不会删除本地音乐文件。</div><footer><span>勾选歌曲后操作</span><button id="apply" class="primary">应用并返回</button></footer></section></main>
<script>
const names=['陈绮贞 · 旅行的意义','朴树 · 平凡之路','许巍 · 蓝莲花','坂本龙一 · Merry Christmas Mr. Lawrence'];let active=0,paused=false,selected=0,mode=0,saved=[0,1,2,3],draft=[],dest=[],savedDest=[];const $=id=>document.getElementById(id);function render(){ $('tracks').innerHTML=names.map((n,i)=>`<button class="track ${i===active?'playing':''}" aria-selected="${i===selected}" data-i="${i}"><span>${i===active?'♪　':''}${n}</span><small>04:05</small></button>`).join('');$('title').textContent=names[active];$('title').title=names[active];$('toggle').innerHTML=`<svg><use href="#${paused?'play':'pause'}"></use></svg>`;$('toggle').setAttribute('aria-label',paused?'播放':'暂停');$('status').textContent=paused?'已暂停':'正在播放';}render();$('tracks').onclick=e=>{const b=e.target.closest('button');if(b){selected=+b.dataset.i;render()}};$('tracks').ondblclick=e=>{const b=e.target.closest('button');if(b){active=+b.dataset.i;paused=false;render()}};$('toggle').onclick=()=>{paused=!paused;render()};$('nextTrack').onclick=()=>{active=(active+1)%4;render()};$('prev').onclick=()=>{active=(active+3)%4;render()};$('mode').onclick=()=>{$('mode').textContent=['循环','单曲','随机','顺序'][mode=(mode+1)%4]};$('stop').onclick=()=>{paused=true;render();$('status').textContent='已停止';$('seek').value=0;$('time').textContent='00:00'};$('seek').oninput=e=>{$('time').textContent=String(Math.floor(e.target.value/60)).padStart(2,'0')+':'+String(e.target.value%60).padStart(2,'0')};document.querySelector('.volume input').oninput=e=>e.target.nextElementSibling.textContent=e.target.value+'%';
function management(){ $('sourceSongs').innerHTML=draft.map(i=>`<label><input type="checkbox" value="${i}">${names[i]}</label>`).join('');$('destSongs').innerHTML=dest.map(i=>`<label>${names[i]}</label>`).join('');for(const id of ['copy','move','remove'])$(id).disabled=!document.querySelector('#sourceSongs input:checked');} $('manage').onclick=()=>{draft=[...saved];dest=[...savedDest];management();$('management').hidden=false};$('sourceSongs').onchange=()=>{for(const id of ['copy','move','remove'])$(id).disabled=!document.querySelector('#sourceSongs input:checked')};for(const id of ['copy','move','remove'])$(id).onclick=()=>{const ids=[...document.querySelectorAll('#sourceSongs input:checked')].map(x=>+x.value);if(id!=='remove')dest=[...new Set([...dest,...ids])];if(id!=='copy')draft=draft.filter(i=>!ids.includes(i));management();$('notice').textContent='有待应用的更改；移除不会删除本地音乐文件。'};$('cancel').onclick=()=>$('management').hidden=true;$('apply').onclick=()=>{saved=[...draft];savedDest=[...dest];$('management').hidden=true};$('add').onclick=()=>{$('status').textContent='原型：正式程序使用本地文件选择器'};$('scenario').onchange=e=>{paused=e.target.value==='暂停';render();$('tracks').hidden=false;$('toggle').disabled=false;$('status').classList.remove('error');if(e.target.value==='空歌单'){$('tracks').hidden=true;$('title').textContent='添加音乐，开始聆听';$('toggle').disabled=true;$('status').textContent='歌单为空'}if(e.target.value==='长文件名')$('title').textContent='这是一首超长中文歌曲名称 — Live Acoustic Session 2026.flac';if(e.target.value==='播放错误'){$('status').textContent='无法打开文件，请检查文件是否已移动';$('status').classList.add('error')}};
</script></body></html>
