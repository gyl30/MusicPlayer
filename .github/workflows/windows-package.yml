name: Windows NSIS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis-installer:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 安装 Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.9.3
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - name: 安装 SDL2、Boost 和 FFmpeg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'vcpkg is not installed on this runner' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }
          "$PWD/vcpkg_installed/x64-windows/bin" | Add-Content $env:GITHUB_PATH
      - name: 安装 NSIS
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
            $nsisDir = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
            $makensisPath = Join-Path $nsisDir 'makensis.exe'
            if (-not (Test-Path $makensisPath)) { throw "makensis.exe was not installed in $nsisDir" }
            $nsisDir | Add-Content $env:GITHUB_PATH
          }
      - name: 配置、构建并运行 Qt 测试
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          $installed = Join-Path $PWD 'vcpkg_installed'
          $ffmpeg = Join-Path $installed 'x64-windows'
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_INSTALLED_DIR="$installed" `
            -DFFMPEG_ROOT="$ffmpeg" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          # 先检查测试进程能否启动，避免 DLL/Qt 插件加载错误被 41 条 CTest 失败淹没。
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:QT_DEBUG_PLUGINS = '1'
          $testExe = Join-Path $PWD 'build/Release/playback_tests.exe'
          $stdout = Join-Path $PWD 'build/test-launch.stdout.txt'
          $stderr = Join-Path $PWD 'build/test-launch.stderr.txt'
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "Test executable: $testExe"
          $process = Start-Process -FilePath $testExe -ArgumentList 'database_connection_lifecycle' `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          $status = [long]$process.ExitCode -band 0xffffffffL
          Write-Host ("Test process exit: {0} (NTSTATUS 0x{1:X8})" -f $process.ExitCode, $status)
          if ($process.ExitCode -ne 0) { throw 'Test startup or smoke case failed; see exit status and stderr above' }
          Remove-Item Env:QT_DEBUG_PLUGINS
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "CTest failed: $LASTEXITCODE" }
      - name: 生成并检查 NSIS 安装程序
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G NSIS -B dist --verbose
          if ($LASTEXITCODE -ne 0) { throw "CPack failed: $LASTEXITCODE" }
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          Get-Item $installer.FullName | Format-List FullName, Length
          $listing = & 7z.exe l -slt $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect NSIS installer contents' }
          $contents = $listing -join "`n"
          $required = @(
            '(?m)^Path = .*platforms[/\\]qwindows\.dll$',
            '(?m)^Path = .*sqldrivers[/\\]qsqlite\.dll$',
            '(?m)^Path = .*SDL2\.dll$',
            '(?m)^Path = .*avformat-\d+\.dll$',
            '(?m)^Path = .*avcodec-\d+\.dll$',
            '(?m)^Path = .*avutil-\d+\.dll$',
            '(?m)^Path = .*swresample-\d+\.dll$'
          )
          foreach ($pattern in $required) {
            if ($contents -notmatch $pattern) { throw "NSIS installer is missing required runtime file: $pattern" }
          }
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musicplayer-windows-x64-nsis
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
