name: macOS DMG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    name: ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-large
            arch: x86_64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 安装 Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.9.3
          arch: clang_64
          modules: qtmultimedia qtsvg
      - name: 安装 SDL2、Boost 和 FFmpeg
        run: brew install sdl2 boost ffmpeg pkg-config
      - name: 检查原生 runner 架构
        run: |
          actual=$(uname -m)
          test "$actual" = "${{ matrix.arch }}" || {
            echo "Expected ${{ matrix.arch }} runner, got $actual" >&2
            exit 1
          }
      - name: 配置、构建并运行 Qt 测试
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$(brew --prefix sdl2);$(brew --prefix boost)"
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure -j1
      - name: 生成并检查 DMG
        run: |
          cpack --config build/CPackConfig.cmake -G DragNDrop -B dist --verbose
          package=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$package"
          hdiutil verify "$package"
          ls -lh "$package"
